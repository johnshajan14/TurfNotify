<!DOCTYPE html>
<html>
{% load static %}
<head>
    <title>Create Announcement</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #166534, #22c55e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 36px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .page-header { text-align: center; margin-bottom: 24px; }
        .page-header h1 { color: #166534; font-size: 24px; margin: 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 11px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px; font-size: 14px;
            box-sizing: border-box; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn-submit {
            width: 100%; padding: 13px;
            background: #22c55e; color: white;
            border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-submit:hover { background: #16a34a; transform: translateY(-2px); }
        .back-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .back-link a { color: #16a34a; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="page-header">
        <h1>📢 Create Announcement</h1>
    </div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" placeholder="Announcement title" required />
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea name="content" placeholder="Write your announcement here..."></textarea>
        </div>
        <button type="submit" class="btn-submit">📢 Post Announcement</button>
    </form>
    <div class="back-link"><a href="/home/">← Back to Home</a></div>
</div>
</body>
</html>
